[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "mikubot"
dynamic = ["version", "dependencies"]
description = "Local QQ companion and administrator-authorized task assistant"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
mikubot = "mikubot.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "mikubot.__version__"}
dependencies = {file = ["requirements-server.txt"]}

[project.optional-dependencies]
desktop = ["pystray==0.19.5; sys_platform == 'win32'", "pywebview==6.2.1; sys_platform == 'win32'", "pythonnet==3.2.1; sys_platform == 'win32'", "clr_loader==0.3.1; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["mikubot*", "qunyu*"]

[tool.setuptools.package-data]
mikubot = ["static/*", "static/assets/brand/*", "resources/*.ps1", "resources/*.cmd", "resources/csp/*", "resources/csp/references/*"]
