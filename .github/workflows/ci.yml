name: Core compatibility and isolation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-server.txt pytest==9.1.1
      - run: python -m pytest -q
      - run: python -m shiori --help
      - run: python -m qunyu --help
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose build
      - name: Validate optional resource limits and inherited protections
        run: |
          docker compose -f compose.yaml -f compose.low-memory.yaml config --quiet
          docker compose -f compose.yaml -f compose.low-memory.yaml create
          python -c "import json,subprocess; base=['docker','compose','-f','compose.yaml','-f','compose.low-memory.yaml']; cid=subprocess.check_output(base+['ps','--all','--quiet','shiori'],text=True).strip(); c=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]; h=c['HostConfig']; assert h['Memory']==768*1024*1024 and h['NanoCpus']==1000000000; assert h['ReadonlyRootfs'] and h['PidsLimit']==128 and 'ALL' in h['CapDrop']; assert c['Config']['User']=='10001:10001'; assert h['LogConfig']['Config']['max-size']=='10m' and h['LogConfig']['Config']['max-file']=='3'; assert h['PortBindings']['8765/tcp'][0]['HostIp']=='127.0.0.1'"
      - run: python -c "import subprocess; from shiori.sandbox import IMAGE; subprocess.run(['docker','pull',IMAGE],check=True)"
      - run: python scripts/check_docker_isolation.py --require
