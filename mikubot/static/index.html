<body>
  <div id="auth-root"><main class="auth-page"><section class="auth-card"><div class="auth-brand"><span class="miku-mark">m<span>♪</span></span><strong>mikubot.</strong></div><p>正在检查登录状态…</p></section></main></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="mikubot首页" data-page="overview">
        <span class="brand-mark miku-mark" aria-hidden="true">m<span>♪</span></span>
        <span><strong>mikubot<span class="brand-dot">.</span></strong><small>CHAT · CREATE · DO</small></span>
      </a>
      <div class="workspace-label"><span class="tiny-dot"></span> 本地工作空间 <span id="workspace-version">—</span></div>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-bottom">
        <button class="btn ghost sidebar-help" data-page="help">使用指南与常见问题 ↗</button>
        <button class="btn ghost sidebar-manage-open" data-action="open-sidebar-manage"><span aria-hidden="true">☰</span> 管理侧边栏</button>
        <button class="sidebar-status" data-action="go-settings"><span class="status-dot" id="sidebar-status-dot"></span><span><strong id="sidebar-status-text">正在连接本地服务</strong><small id="sidebar-status-sub">你的数据，留在你的电脑</small></span><span>↗</span></button>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button mobile-menu" id="menu-toggle" aria-label="展开导航">☰</button><span class="breadcrumb"><span class="workspace-prefix">工作空间 <span>/</span></span><strong id="page-breadcrumb">概览</strong></span></div>
        <div class="topbar-right"><button class="btn small header-update" data-action="update-open" title="查看版本、检查更新与选择历史版本"><span id="header-version">v0.1.6</span><span>版本与更新</span></button><label class="scope-picker"><span id="scope-icon"></span><select id="global-scope" aria-label="选择会话空间"></select></label><span class="topbar-divider"></span><button class="icon-button" data-action="refresh" title="刷新数据" aria-label="刷新数据" id="refresh-button"></button><button class="btn ghost small logout-button" data-auth-action="logout" title="退出当前登录">退出登录</button><div class="owner-avatar" title="已认证管理员 mikubot">M</div></div>
      </header>
      <div id="port-warning" class="port-warning" role="alert" hidden></div>
      <main id="content" tabindex="-1"><div class="loading-page"><span class="spinner"></span><p>正在启动 mikubot…</p></div></main>
      <footer class="page-footer"><span>mikubot <span id="version-label">—</span></span><span>你的聊天与电脑助手</span></footer>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
  <input type="file" id="note-input" accept=".txt,.md,.markdown,.csv,.json,.pdf,.docx" hidden>
  <input type="file" id="attachment-input" accept=".txt,.md,.markdown,.csv,.json,.jsonl,.html,.srt,.vtt,.pdf,.docx" hidden>
  <input type="file" id="corpus-input" accept=".zip,application/zip" hidden>
  <input type="file" id="restore-input" accept=".zip,application/zip" hidden>
</body>
